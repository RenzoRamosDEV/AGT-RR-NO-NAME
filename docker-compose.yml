services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_USER: duelo
      POSTGRES_PASSWORD: duelo
      POSTGRES_DB: duelo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duelo"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: docker.io/temporalio/auto-setup:1.24.2
    profiles: ["infra"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: duelo
      POSTGRES_PWD: duelo
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: docker.io/temporalio/ui:2.31.2
    profiles: ["infra"]
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"

  api:
    build:
      context: ./backend
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+asyncpg://duelo:duelo@postgres:5432/duelo
      TEMPORAL_ADDRESS: temporal:7233
      # Solo desarrollo local; en cualquier otro entorno se define INGEST_TOKEN de verdad.
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      # Opcional: sin él, GET /reviews/{id}/raw-output responde 404 (16+ caracteres, != INGEST_TOKEN).
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      # Orígenes del navegador permitidos (el dev server de Vite); vacío = sin CORS.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Límite de ingesta/reintento por IP y ventana; 0 lo desactiva (p. ej. para `just load`).
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-300}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-1800}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
