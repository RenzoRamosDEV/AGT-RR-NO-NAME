[project]
name = "review-arena"
version = "0.1.0"
description = "Review Arena backend - hexagonal monolith (API, platform worker, agents worker)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "temporalio>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.9",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_arena"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=review_arena --cov-report=term-missing"

[tool.coverage.run]
source = ["src/review_arena"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# El directorio de migraciones backend/alembic/ comparte nombre con el paquete
# de terceros `alembic`; sin esto, la detección de primera/tercera parte de
# ruff clasifica los imports de `alembic` de forma inconsistente.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["review_arena"]

[tool.importlinter]
root_package = "review_arena"

[[tool.importlinter.contracts]]
name = "Hexagonal layering: domain <- application <- adapters/entrypoints/workflows"
type = "layers"
layers = [
    "review_arena.entrypoints | review_arena.adapters | review_arena.workflows",
    "review_arena.application",
    "review_arena.domain",
]
